name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            command: enterlight
            ldflags: -s -w -X main.version=${GITHUB_REF_NAME}
          - goos: windows
            goarch: arm64
            ext: .exe
            command: enterlight
            ldflags: -s -w -X main.version=${GITHUB_REF_NAME}
          - goos: linux
            goarch: amd64
            ext: ""
            command: enterlight-wsl
            ldflags: -s -w
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "${{ matrix.ldflags }}" \
            -o "dist/enterlight-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            "./cmd/${{ matrix.command }}"
      - name: Add WSL installer scripts
        if: matrix.goos == 'linux'
        run: cp scripts/install-wsl.sh scripts/uninstall-wsl.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: enterlight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
